steps:
  # 1. Build the backend container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/baton-api:$COMMIT_SHA', './backend']

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/baton-api:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'baton-api'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/baton-api:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'baton-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,TRANSCRIBE_ENGINE=chirp3,SPEECH_LOCATION=us,GEMINI_MODEL=gemini-2.5-flash,AEGIS_API_KEY=dev-key'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/baton-api:$COMMIT_SHA'

substitutions:
  _REGION: 'asia-southeast1'
  _REPO_NAME: 'baton'

