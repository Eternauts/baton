steps:
  # 1. Build the backend container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/baton-api:$COMMIT_SHA', './backend']

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/baton-api:$COMMIT_SHA']

  # 3. Deploy to Cloud Run (backend/scripts/deploy.sh is the primary path; keep the two in sync)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'baton-api'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/baton-api:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'baton-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,TRANSCRIBE_ENGINE=gemini,GEMINI_MODEL=gemini-3.5-flash,GEMINI_FAST_MODEL=gemini-3.5-flash-lite,GEMINI_LOCATION=global,EMBEDDING_MODEL=gemini-embedding-001,EMBEDDING_LOCATION=asia-southeast1,EMBEDDING_DIM=768'
      - '--set-secrets'
      - 'AEGIS_API_KEY=aegis-api-key:latest,AEGIS_DEMO_KEY=aegis-demo-key:latest'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/baton-api:$COMMIT_SHA'

substitutions:
  _REGION: 'asia-southeast1'
  _REPO_NAME: 'baton'

