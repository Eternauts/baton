server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # The app's JavaScript and WebAssembly are several MB: compress them.
  gzip on;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

  # Always revalidate (ETag), so a redeploy reaches visitors on their next load.
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
