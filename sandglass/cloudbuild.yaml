# CI/CD for the Sandglass service. Trigger from the repo root with:
#   gcloud builds submit --config sandglass/cloudbuild.yaml --substitutions=SHORT_SHA=$(git rev-parse --short HEAD) .
# Assumes scripts/deploy.sh ran once (APIs, service account, bucket, secrets, Artifact Registry repo).
steps:
  - id: test
    name: python:3.12-slim
    dir: sandglass
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements-dev.txt && BATON_USE_EMBEDDINGS=false pytest -q"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA", "sandglass"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA"]

  # Only the image changes here; env vars, secrets and scaling set by deploy.sh are kept.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA
      - --region=$_REGION
      - --update-env-vars=BATON_VERSION=$SHORT_SHA

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA

substitutions:
  _REGION: asia-southeast1
  _REPO: baton
  _SERVICE: baton-sandglass

options:
  logging: CLOUD_LOGGING_ONLY
